---
# KeePassXC trancado quando a YubiKey sai da porta USB: uma regra udev
# ("remove", vendor Yubico 1050 — qualquer modelo) chama um script que
# tranca as bases do KeePassXC em cada sessão aberta, via D-Bus
# (org.keepassxc.KeePassXC.MainWindow.lockAllDatabases). Portado de
# lbssousa/nix-config (modules/system/security/keepassxc-yubikey-lock.nix).
#
# É da máquina, não de uma pessoa: o script percorre todas as sessões em
# /run/user, então vale para todo usuário com o KeePassXC aberto, qualquer
# que seja o método de instalação (feature keepassxc). Se o KeePassXC não
# estiver instalado (nem escolhido como distrobox, cujos containers são de
# cada usuário), avisa e pula. A integração D-Bus vem ligada por padrão
# (Ferramentas > Configurações > Geral).
#
# Desligada (revert), remove a regra e o script.
#
# Uso: just apply keepassxc-yubikey-lock
- name: KeePassXC — trancar ao remover a YubiKey
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [keepassxc-yubikey-lock]

  vars:
    feature_on: "{{ features['keepassxc-yubikey-lock'] | default(true) }}"
    keepassxc_present: >-
      {{ keepassxc_found | default('') != '' or
         (features['keepassxc'] | default(false) and keepassxc_install_method == 'distrobox') }}

  tasks:
    - ansible.builtin.import_tasks: tasks/keepassxc-detect.yml
      when: feature_on | bool

    - name: Avisar que o KeePassXC não foi encontrado
      ansible.builtin.debug:
        msg: >-
          PULADO: KeePassXC não encontrado (Flatpak, snap, AppImage ou
          distrobox). Ligue a feature keepassxc em `just configure` e rode
          `just apply keepassxc keepassxc-yubikey-lock`.
      when: feature_on | bool and not keepassxc_present | bool

    - name: Instalar a regra udev e o script
      become: true
      when: feature_on | bool and keepassxc_present | bool
      block:
        - name: Garantir o diretório do script
          ansible.builtin.file:
            path: "{{ keepassxc_yubikey_lock_script_dest | dirname }}"
            state: directory
            mode: "0755"

        - name: Instalar o script de trava via D-Bus
          ansible.builtin.copy:
            src: keepassxc-yubikey-lock.sh
            dest: "{{ keepassxc_yubikey_lock_script_dest }}"
            owner: root
            group: root
            mode: "0755"

        - name: Instalar a regra udev (dispara na remoção da YubiKey)
          ansible.builtin.template:
            src: keepassxc-yubikey-lock.rules.j2
            dest: "{{ keepassxc_yubikey_lock_udev_rule_dest }}"
            owner: root
            group: root
            mode: "0644"
          notify: reload udev rules

    - name: Remover a regra udev e o script
      become: true
      when: not feature_on | bool
      block:
        - name: Remover a regra udev
          ansible.builtin.file:
            path: "{{ keepassxc_yubikey_lock_udev_rule_dest }}"
            state: absent
          notify: reload udev rules

        - name: Remover o script
          ansible.builtin.file:
            path: "{{ keepassxc_yubikey_lock_script_dest }}"
            state: absent

  handlers:
    - name: reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
      become: true
      listen: reload udev rules
