---
# YubiKey sumindo para o GnuPG até reiniciar o pcscd na mão.
#
# DESABILITADO: a causa não era uma corrida do pcscd com o udev, e sim o
# OpenSC registrado como módulo global do p11-kit — um daemon do desktop o
# carrega, abre o cartão pelo pcscd e o scdaemon do GnuPG, que precisa de
# acesso exclusivo, fica sem cartão. A imagem dakota-inspiron-5490 corrige
# isso (files/opensc-p11-kit.module, README "Making the YubiKey visible to
# GnuPG at boot"). O drop-in `udevadm settle` e a regra udev que reiniciava
# o pcscd a cada conexão da YubiKey só escondiam o sintoma, e o restart
# derruba todo cliente do pcscd, inclusive um scdaemon no meio do uso.
#
# Esta play roda sempre (a feature é hidden em features.yml) e só remove o
# que instalações antigas deixaram. Não faz nada se não houver o que remover.
# O pam_u2f e a chave GPG do cartão ficam com as receitas `ujust yubikey-*`
# da mesma imagem.
- name: YubiKey — remover o drop-in e a regra udev antigos do pcscd
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [yubikey-pcscd]

  tasks:
    - name: Remover o drop-in do pcscd (udevadm settle)
      ansible.builtin.file:
        path: "{{ yubikey_pcscd_dropin }}"
        state: absent
      become: true
      notify: reload systemd

    - name: Remover o diretório do drop-in, se ficou vazio
      ansible.builtin.command: rmdir --ignore-fail-on-non-empty "{{ yubikey_pcscd_dropin | dirname }}"
      args:
        removes: "{{ yubikey_pcscd_dropin | dirname }}"
      become: true
      changed_when: false

    - name: Remover a regra udev que reiniciava o pcscd ao conectar a YubiKey
      ansible.builtin.file:
        path: "{{ yubikey_pcscd_restart_udev_rule_dest }}"
        state: absent
      become: true
      notify: reload udev rules

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      listen: reload systemd

    - name: reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
      become: true
      listen: reload udev rules
