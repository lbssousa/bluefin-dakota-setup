---
# KeePassXC, parte de cada pessoa. As duas últimas plays usam a instalação
# encontrada — a do método escolhido (feature keepassxc) ou, sem ela,
# qualquer outra (Flatpak, snap, AppImage, distrobox); sem nenhuma, avisam
# e pulam.
#
#   keepassxc            com o método distrobox, o container rootless desta
#                        pessoa (Debian sid, keepassxc-full) e o app e os
#                        binários exportados para ~/.local; nos outros
#                        métodos a instalação é da fase de sistema
#                        (playbooks/system/keepassxc.yml). Atualizar:
#                        `distrobox upgrade keepassxc`. Desligada, só para
#                        de ser gerenciada.
#   keepassxc-browser    ponte de native messaging entre o Flatpak do
#                        KeePassXC e os navegadores Flatpak, para a extensão
#                        KeePassXC-Browser. Cada Flatpak só enxerga o próprio
#                        ~/.var/app/<id>, então o manifesto e um wrapper
#                        (keepassxc-proxy-host, flatpak-spawn --host para o
#                        keepassxc-proxy da instalação encontrada)
#                        ficam DENTRO do diretório de cada navegador
#                        instalado, que ganha o talk-name
#                        org.freedesktop.Flatpak. Desligada (revert),
#                        remove os três.
#   keepassxc-autostart  o KeePassXC aberto no login: o Flatpak não cria o
#                        ~/.config/autostart sozinho ("Iniciar com o
#                        sistema" depende do portal Background). Desligada
#                        (revert), remove o .desktop.
#
# Uso: just apply keepassxc keepassxc-browser keepassxc-autostart
- name: KeePassXC — container distrobox desta pessoa
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [keepassxc]

  vars:
    feature_on: "{{ features['keepassxc'] | default(true) }}"
    box: "{{ keepassxc_distrobox_name }}"
    box_enter: distrobox enter -n {{ keepassxc_distrobox_name | quote }} --

  tasks:
    - name: KeePassXC em distrobox
      when: feature_on | bool and keepassxc_install_method == 'distrobox'
      block:
        - name: Verificar se o distrobox está disponível
          ansible.builtin.command: which distrobox
          register: keepassxc_distrobox_check
          changed_when: false
          check_mode: false
          failed_when: false

        - name: Avisar que o distrobox não foi encontrado
          ansible.builtin.debug:
            msg: >-
              PULADO: distrobox não encontrado no PATH. Escolha outro método
              de instalação do KeePassXC em `just configure`.
          when: keepassxc_distrobox_check.rc != 0

        - name: Criar e exportar o container
          when: keepassxc_distrobox_check.rc == 0
          block:
            - name: Ver se o container já existe
              ansible.builtin.command: distrobox list --no-color
              register: keepassxc_distrobox_list
              changed_when: false
              check_mode: false

            # O init do distrobox (que instala o keepassxc-full) roda no
            # primeiro enter, logo abaixo: a primeira execução demora.
            - name: Criar o container {{ box }} ({{ keepassxc_distrobox_image }})
              ansible.builtin.command: >-
                distrobox create --yes --no-entry
                --name {{ box | quote }}
                --image {{ keepassxc_distrobox_image | quote }}
                --additional-packages {{ keepassxc_distrobox_package | quote }}
              when: >-
                keepassxc_distrobox_list.stdout_lines
                | select('search', '\|\s*' ~ (box | regex_escape) ~ '\s*\|')
                | list | length == 0

            # Também cobre um container que já existia sem o pacote.
            - name: Garantir o {{ keepassxc_distrobox_package }} no container
              ansible.builtin.shell: >-
                {{ box_enter }} sh -c
                'dpkg-query -W -f="\${Status}" {{ keepassxc_distrobox_package }} 2>/dev/null
                | grep -q "ok installed" && echo present ||
                { sudo apt-get update -q && sudo apt-get install -y {{ keepassxc_distrobox_package }}; }'
              register: keepassxc_distrobox_pkg
              changed_when: "'present' not in keepassxc_distrobox_pkg.stdout_lines"

            - name: Conferir a versão do KeePassXC no container (2.8.0 ou posterior)
              ansible.builtin.command: "{{ box_enter }} dpkg-query -W -f=${Version} {{ keepassxc_distrobox_package }}"
              register: keepassxc_distrobox_version
              changed_when: false
              check_mode: false
              failed_when: >-
                keepassxc_distrobox_version.rc != 0 or
                not (keepassxc_distrobox_version.stdout_lines | last
                     | regex_replace('[+~].*$', '')) is version('2.8.0', '>=')

            - name: Exportar o KeePassXC para o menu de aplicativos
              ansible.builtin.command:
                cmd: "{{ box_enter }} distrobox-export --app keepassxc"
                creates: "{{ target_xdg_data_home }}/applications/{{ box }}-org.keepassxc.KeePassXC.desktop"

            - name: Exportar keepassxc, keepassxc-proxy e keepassxc-cli para ~/.local/bin
              ansible.builtin.command:
                cmd: >-
                  {{ box_enter }} distrobox-export --bin /usr/bin/{{ item }}
                  --export-path {{ keepassxc_distrobox_bin_dir | quote }}
                creates: "{{ keepassxc_distrobox_bin_dir }}/{{ item }}"
              loop: [keepassxc, keepassxc-proxy, keepassxc-cli]

        - ansible.builtin.import_tasks: tasks/keepassxc-detect.yml

        - name: Avisar sobre outras instalações do KeePassXC
          ansible.builtin.debug:
            msg: >-
              AVISO: o KeePassXC também está instalado como
              {{ keepassxc_methods[item].title }}, além do distrobox. Para
              removê-lo: {{ keepassxc_methods[item].remove }}
          loop: "{{ keepassxc_found_all | reject('equalto', 'distrobox') | list }}"

- name: KeePassXC-Browser nos navegadores Flatpak
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [keepassxc-browser]

  vars:
    feature_on: "{{ features['keepassxc-browser'] | default(true) }}"

  tasks:
    - ansible.builtin.import_tasks: tasks/keepassxc-detect.yml

    - name: Avisar que o KeePassXC não foi encontrado
      ansible.builtin.debug:
        msg: >-
          PULADO: KeePassXC não encontrado (Flatpak, snap, AppImage ou
          distrobox). Ligue a feature keepassxc em `just configure` e rode
          `just apply keepassxc keepassxc-browser`.
      when: feature_on | bool and keepassxc_found == ''

    - name: Ver quais navegadores Flatpak suportados estão instalados
      ansible.builtin.command: flatpak info {{ item.flatpak_id }}
      register: keepassxc_browsers
      changed_when: false
      failed_when: false
      loop: "{{ keepassxc_native_messaging_targets }}"
      loop_control:
        label: "{{ item.flatpak_id }}"

    # Um block não aceita loop: as tasks abaixo repetem loop/when/vars.
    - name: Garantir o diretório de dados do navegador
      ansible.builtin.file:
        path: "{{ keepassxc_proxy_host_dest | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ keepassxc_browsers.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: feature_on | bool and keepassxc_found != '' and item.rc == 0
      vars:
        keepassxc_proxy_host_dest: "{{ target_home }}/.var/app/{{ item.item.flatpak_id }}/data/keepassxc-proxy-host"

    - name: Instalar o wrapper flatpak-spawn (keepassxc-proxy-host)
      ansible.builtin.template:
        src: keepassxc-proxy-host.sh.j2
        dest: "{{ keepassxc_proxy_host_dest }}"
        mode: "0755"
      loop: "{{ keepassxc_browsers.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: feature_on | bool and keepassxc_found != '' and item.rc == 0
      vars:
        keepassxc_proxy_host_dest: "{{ target_home }}/.var/app/{{ item.item.flatpak_id }}/data/keepassxc-proxy-host"

    - name: Garantir o diretório de native messaging hosts do navegador
      ansible.builtin.file:
        path: "{{ keepassxc_native_messaging_dir }}"
        state: directory
        mode: "0755"
      loop: "{{ keepassxc_browsers.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: feature_on | bool and keepassxc_found != '' and item.rc == 0
      vars:
        keepassxc_native_messaging_dir: >-
          {{ target_home }}/.var/app/{{ item.item.flatpak_id }}/{{
          '.mozilla/native-messaging-hosts' if item.item.kind == 'firefox'
          else 'config/' + item.item.vendor_dir + '/NativeMessagingHosts' }}

    - name: Instalar o manifesto de native messaging
      ansible.builtin.template:
        src: org.keepassxc.keepassxc_browser.json.j2
        dest: "{{ keepassxc_native_messaging_dir }}/{{ keepassxc_native_messaging_manifest_name }}"
        mode: "0644"
      loop: "{{ keepassxc_browsers.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: feature_on | bool and keepassxc_found != '' and item.rc == 0
      vars:
        keepassxc_proxy_host_dest: "{{ target_home }}/.var/app/{{ item.item.flatpak_id }}/data/keepassxc-proxy-host"
        keepassxc_native_messaging_dir: >-
          {{ target_home }}/.var/app/{{ item.item.flatpak_id }}/{{
          '.mozilla/native-messaging-hosts' if item.item.kind == 'firefox'
          else 'config/' + item.item.vendor_dir + '/NativeMessagingHosts' }}
        # Dentro do template, "item" seria o resultado do precheck.
        keepassxc_browser_kind: "{{ item.item.kind }}"

    - name: Ler os overrides do navegador
      ansible.builtin.command: flatpak override --user --show {{ item.item.flatpak_id }}
      register: keepassxc_overrides
      changed_when: false
      loop: "{{ keepassxc_browsers.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: item.rc == 0

    - name: Conceder o talk-name org.freedesktop.Flatpak (flatpak-spawn --host)
      ansible.builtin.command: >-
        flatpak override --user --talk-name=org.freedesktop.Flatpak {{ item.item.item.flatpak_id }}
      loop: "{{ keepassxc_overrides.results }}"
      loop_control:
        label: "{{ item.item.item.flatpak_id }}"
      when: >-
        feature_on | bool and keepassxc_found != '' and item is not skipped and
        'org.freedesktop.Flatpak=talk' not in item.stdout
      changed_when: true

    - name: Remover o wrapper
      ansible.builtin.file:
        path: "{{ target_home }}/.var/app/{{ item.item.flatpak_id }}/data/keepassxc-proxy-host"
        state: absent
      loop: "{{ keepassxc_browsers.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: not feature_on | bool and item.rc == 0

    - name: Remover o manifesto
      ansible.builtin.file:
        path: "{{ keepassxc_native_messaging_dir }}/{{ keepassxc_native_messaging_manifest_name }}"
        state: absent
      loop: "{{ keepassxc_browsers.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: not feature_on | bool and item.rc == 0
      vars:
        keepassxc_native_messaging_dir: >-
          {{ target_home }}/.var/app/{{ item.item.flatpak_id }}/{{
          '.mozilla/native-messaging-hosts' if item.item.kind == 'firefox'
          else 'config/' + item.item.vendor_dir + '/NativeMessagingHosts' }}

    - name: Revogar o talk-name org.freedesktop.Flatpak
      ansible.builtin.command: >-
        flatpak override --user --no-talk-name=org.freedesktop.Flatpak {{ item.item.item.flatpak_id }}
      loop: "{{ keepassxc_overrides.results }}"
      loop_control:
        label: "{{ item.item.item.flatpak_id }}"
      when: >-
        not feature_on | bool and item is not skipped and
        'org.freedesktop.Flatpak=talk' in item.stdout
      changed_when: true

- name: KeePassXC no login
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [keepassxc-autostart]

  vars:
    feature_on: "{{ features['keepassxc-autostart'] | default(true) }}"

  tasks:
    - ansible.builtin.import_tasks: tasks/keepassxc-detect.yml
      when: feature_on | bool

    - name: Autostart do KeePassXC
      when: feature_on | bool and keepassxc_found != ''
      block:
        - name: Garantir ~/.config/autostart
          ansible.builtin.file:
            path: "{{ keepassxc_autostart_desktop | dirname }}"
            state: directory
            mode: "0755"

        - name: Instalar o .desktop de autostart
          ansible.builtin.copy:
            dest: "{{ keepassxc_autostart_desktop }}"
            mode: "0644"
            content: |
              [Desktop Entry]
              Type=Application
              Name=KeePassXC
              Comment=Gerenciador de senhas
              Icon={{ keepassxc_methods[keepassxc_found].icon }}
              Exec={{ keepassxc_methods[keepassxc_found].exec }}
              Terminal=false
              X-GNOME-Autostart-enabled=true
              # Gerenciado pelo bluefin-dakota-setup (feature keepassxc-autostart)

    - name: Remover o autostart do KeePassXC
      ansible.builtin.file:
        path: "{{ keepassxc_autostart_desktop }}"
        state: absent
      when: not feature_on | bool
