---
# Atalhos de teclado do GNOME redefinidos para ficarem o mais perto
# possível dos padrões do Omarchy (Hyprland, v4: default/hypr/bindings/*.lua).
# Comparação completa, estratégia e o que não tem equivalente no GNOME:
# docs/omarchy-keybindings.md.
#
# Atalho a atalho: o catálogo é files/omarchy-keybindings.vars.yml e a
# escolha de cada item é feita em `just configure` (ou só a dos atalhos, em
# `just configure-keybindings`); scripts/features.py passa os itens ligados
# em omarchy_keybindings_selected (vazio com a feature desligada).
#
#   1. files/omarchy-keybindings-apply.py aplica os itens escolhidos
#      (idempotente: só grava o que difere), tirando cada atalho de qualquer
#      outra ação que o use, e devolve ao original cada chave que nenhum item
#      escolhido toca mais (valores originais em omarchy_keybindings_state).
#      Atalhos customizados em custom-keybindings/omarchy-*, sem tocar nos
#      customN existentes.
#   2. Bloco gerenciado no Ghostty com as linhas dos itens escolhidos.
# Desligada: nenhum item, ou seja, tudo volta ao original.
#
# Simular: just omarchy-keybindings-dry-run
#
# Os atalhos valem na hora; os do Tiling Shell/Dash to Dock só com a
# extensão instalada.
- name: Atalhos de teclado no estilo Omarchy
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [omarchy-keybindings]

  vars_files:
    - files/omarchy-keybindings.vars.yml

  vars:
    feature_on: "{{ features['omarchy-keybindings'] | default(false) }}"
    omarchy_selected: "{{ omarchy_keybindings_selected | default([]) if feature_on | bool else [] }}"
    omarchy_items: "{{ omarchy_keybindings | selectattr('id', 'in', omarchy_selected) | list }}"
    omarchy_dry_run: false
    omarchy_dry: "{{ omarchy_dry_run | bool }}"
    omarchy_ghostty_marker: "# {mark} omarchy-keybindings (playbooks/omarchy-keybindings.yml)"

  tasks:
    # Versões anteriores guardavam um dump dconf inteiro e o restauravam ao
    # desligar; ele é o estado de antes de qualquer atalho do Omarchy, então
    # é restaurado (e apagado) antes de o motor registrar os originais.
    - name: Procurar backups dconf de versões anteriores
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ omarchy_keybindings_legacy_backups }}"
      register: omarchy_legacy

    - name: Restaurar e apagar os backups dconf de versões anteriores
      ansible.builtin.shell: |
        set -eu
        d={{ item.item | quote }}
        {% for p in omarchy_legacy_backup_paths %}
        f="$d/{{ p | regex_replace('[^A-Za-z0-9]+', '_') }}.ini"
        dconf reset -f {{ p | quote }}
        if [ -s "$f" ]; then dconf load {{ p | quote }} < "$f"; fi
        {% endfor %}
        rm -rf "$d"
      args:
        executable: /bin/bash
      loop: "{{ omarchy_legacy.results }}"
      loop_control:
        label: "{{ item.item }}"
      changed_when: true
      when: item.stat.exists and not omarchy_dry | bool

    - name: Procurar o estado dos atalhos
      ansible.builtin.stat:
        path: "{{ omarchy_keybindings_state }}"
      register: omarchy_state

    # Com a feature desligada e nada aplicado, não há o que fazer (nem
    # sessão gráfica a exigir).
    - name: Atalhos no estilo Omarchy
      when: >-
        feature_on | bool or omarchy_state.stat.exists
        or omarchy_legacy.results | selectattr('stat.exists') | list | length > 0
      block:
        - name: Conferir o gsettings e a sessão
          ansible.builtin.command: gsettings get org.gnome.desktop.wm.keybindings close
          changed_when: false

        - name: Aplicar (ou simular) os atalhos escolhidos
          ansible.builtin.command:
            cmd: python3 {{ (playbook_dir ~ '/files/omarchy-keybindings-apply.py') | quote }}
            stdin: >-
              {{ {'items': omarchy_items, 'scan': omarchy_scan_schemas,
                  'state': omarchy_keybindings_state, 'dry_run': omarchy_dry | bool} | to_json }}
          register: omarchy_apply
          changed_when: (omarchy_apply.stdout | from_json).changes | length > 0
          check_mode: false

        - name: Interpretar o resultado
          ansible.builtin.set_fact:
            omarchy_result: "{{ omarchy_apply.stdout | from_json }}"

        - name: Listar as mudanças ({{ 'simulação, nada foi gravado' if omarchy_dry | bool else 'aplicadas' }})
          ansible.builtin.debug:
            msg: "{{ omarchy_result.changes | map(attribute='key') | zip(omarchy_result.changes | map(attribute='from'), omarchy_result.changes | map(attribute='to')) | map('join', '  :  ') | list }}"
          when: omarchy_result.changes | length > 0

        - name: Itens pulados
          ansible.builtin.debug:
            var: omarchy_result.skipped
          when: omarchy_result.skipped | length > 0

        - name: Avisos
          ansible.builtin.debug:
            var: omarchy_result.warnings
          when: omarchy_result.warnings | length > 0

        - name: Ghostty — keybinds do Omarchy escolhidos
          ansible.builtin.blockinfile:
            path: "{{ omarchy_ghostty_conf }}"
            marker: "{{ omarchy_ghostty_marker }}"
            block: "{{ omarchy_ghostty_lines | join('\n') }}"
            state: "{{ 'present' if omarchy_ghostty_lines else 'absent' }}"
          vars:
            omarchy_ghostty_lines: "{{ omarchy_items | selectattr('ghostty', 'defined') | map(attribute='ghostty') | flatten }}"
          when: not omarchy_dry | bool
          failed_when: false
