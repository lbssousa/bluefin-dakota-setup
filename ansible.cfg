[defaults]
inventory = inventory.ini
host_key_checking = False
stdout_callback = default
display_skipped_hosts = False

[privilege_escalation]
# run0 (o substituto do sudo no systemd) é o become method. Ele autentica
# pelo polkit, e o GNOME registra um agente polkit gráfico: um run0 avulso
# abriria um diálogo por task privilegiada, e o polkit não guarda a
# autorização entre processos run0 separados. Por isso a fase de sistema
# roda sob `run0 --empower` (veja run-empowered.sh): uma autenticação no
# início, e o run0 de cada task passa sem perguntar. Nenhuma senha é
# entregue ao run0 (sem --ask-become-pass), e nenhuma regra polkit de root
# sem senha é instalada.
become_method = community.general.run0
